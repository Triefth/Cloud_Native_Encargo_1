server:
  port: 8080

spring:
  application:
    name: bff-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER:https://login.microsoftonline.com/common/v2.0}
          audiences: ${AZURE_AUDIENCE:api://telemedicina-rural-api}

security:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

# Configuración de Microservicios Backend Desacoplados
services:
  citas:
    url: ${CITAS_SERVICE_URL:http://localhost:8081}
  consultas:
    url: ${CONSULTAS_SERVICE_URL:http://localhost:8082}
  fichas:
    url: ${FICHAS_SERVICE_URL:http://localhost:8083}
  notificaciones:
    url: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8084}
  reportes:
    url: ${REPORTES_SERVICE_URL:http://localhost:8085}
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8086}
  clinicas:
    url: ${CLINICAS_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
