version: '3.8'

services:
  bff-service:
    build: ./bff-service
    ports:
      - "8080:8080"
    environment:
      - AZURE_ISSUER=${AZURE_ISSUER:-https://login.microsoftonline.com/72fd0b5a-8a6a-4cff-89f6-bde961f7e250/v2.0}
      - AZURE_AUDIENCE=${AZURE_AUDIENCE:-dc5dbf61-ed71-4920-97ac-bfee3c1a63b9}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - CITAS_SERVICE_URL=http://citas-service:8081
      - CONSULTAS_SERVICE_URL=http://consultas-service:8082
      - FICHAS_SERVICE_URL=http://fichas-service:8083
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8084
      - REPORTES_SERVICE_URL=http://reportes-service:8085
      - USUARIOS_SERVICE_URL=http://usuarios-service:8086
      - CLINICAS_SERVICE_URL=http://clinicas-service:8087
      - KAFKA_SERVICE_URL=http://kafka-service:8888
    depends_on:
      - citas-service
      - consultas-service
      - fichas-service
      - notificaciones-service
      - reportes-service
      - usuarios-service
      - clinicas-service
      - kafka-service

  citas-service:
    build: ./citas-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq-1:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - rabbitmq-1
      - rabbitmq-2

  consultas-service:
    build: ./consultas-service
    ports:
      - "8082:8082"

  fichas-service:
    build: ./fichas-service
    ports:
      - "8083:8083"

  notificaciones-service:
    build: ./notificaciones-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq-1:5672,rabbitmq-2:5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - rabbitmq-1
      - rabbitmq-2

  reportes-service:
    build: ./reportes-service
    ports:
      - "8085:8085"

  usuarios-service:
    build: ./usuarios-service
    ports:
      - "8086:8086"

  clinicas-service:
    build: ./clinicas-service
    ports:
      - "8087:8087"

  kafka-service:
    build: ./kafka-service
    container_name: kafka-service
    ports:
      - "8888:8888"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - default
      - rabbitmq_cluster

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"   # AMQP port (mapeado a 5673 en host)
      - "15673:15672" # Management UI (mapeado a 15673 en host)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value" # Mismo Cookie
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      - rabbitmq-1
    networks:
      - default
      - rabbitmq_cluster

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:

networks:
  default:
  rabbitmq_cluster:
    driver: bridge

