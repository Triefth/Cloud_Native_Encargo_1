server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  datasource:
    url: jdbc:h2:mem:notificacionesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin123}
    virtual-host: /
    listener:
      type: simple
      simple:
        missing-queues-fatal: false
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 5
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      group-id: notificaciones-alertas-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    topics:
      alertas: ${KAFKA_TOPIC_ALERTAS:telemedicina.alertas}
      citas-eventos: ${KAFKA_TOPIC_CITAS_EVENTOS:telemedicina.citas.eventos}

# =====================================================================
# Centralización de Nombres de Colas, Exchanges y Routing Keys (Duoc UC)
# =====================================================================
app:
  rabbitmq:
    queues:
      hello: ${APP_QUEUE_HELLO:hello}
      orders: ${APP_QUEUE_ORDERS:orders.queue}
      orders-dlq: ${APP_QUEUE_ORDERS_DLQ:orders.dlq}
      all-logs: ${APP_QUEUE_ALL_LOGS:all_logs_queue}
      errors-only: ${APP_QUEUE_ERRORS_ONLY:errors_only_queue}
      citas: ${APP_QUEUE_CITAS:citas.queue}
      citas-dlq: ${APP_QUEUE_CITAS_DLQ:citas.dlq}
    exchanges:
      logs: ${APP_EXCHANGE_LOGS:logs_direct_exchange}
      orders: ${APP_EXCHANGE_ORDERS:orders.exchange}
      orders-dlx: ${APP_EXCHANGE_ORDERS_DLX:orders.dlx}
      citas: ${APP_EXCHANGE_CITAS:citas.exchange}
      citas-dlx: ${APP_EXCHANGE_CITAS_DLX:citas.dlx}
    routing-keys:
      order-created: ${APP_RK_ORDER_CREATED:order.created}
      order-dead: ${APP_RK_ORDER_DEAD:order.dead}
      cita-created: ${APP_RK_CITA_CREATED:cita.created}
      cita-dead: ${APP_RK_CITA_DEAD:cita.dead}
      log-info: ${APP_RK_LOG_INFO:INFO}
      log-warning: ${APP_RK_LOG_WARNING:WARNING}
      log-error: ${APP_RK_LOG_ERROR:ERROR}

  kafka:
    topics:
      alertas:
        name: ${KAFKA_TOPIC_ALERTAS:telemedicina.alertas}
        partitions: 3
        replicas: 1
      citas-eventos:
        name: ${KAFKA_TOPIC_CITAS_EVENTOS:telemedicina.citas.eventos}
        partitions: 3
        replicas: 1
      notificaciones:
        name: ${KAFKA_TOPIC_NOTIFICACIONES:telemedicina.notificaciones}
        partitions: 3
        replicas: 1
