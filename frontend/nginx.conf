server {
    listen 80;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Carpeta con los archivos compilados de React/Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para React Router / SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el Backend BFF Gateway
    # Permite consumir /api/ hacia el BFF sin problemas de CORS ni exponer puertos adicionales
    location /api/ {
        proxy_pass http://BACKEND_HOST:8080/api/;
        proxy_http_version 1.0;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
