server {
    listen 80;
    server_name _;

    # Carpeta con los archivos compilados de React/Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para React Router / SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso opcional hacia el Backend si no se usa API Gateway directo
    # Permite consumir /api/ hacia el BFF sin problemas de CORS ni exponer puertos adicionales
    # Cambia http://BACKEND_IP:8080 por la IP pública de tu EC2 Backend o URL de API Gateway
    location /api/ {
        proxy_pass http://BACKEND_HOST:8080/api/;
        proxy_http_version 1.0;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
